name: Build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "assets/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            waypoint-core
            src-tauri

      # Deterministic suites only (committed fixtures). The model parity suites
      # are #[ignore]d: they need the exported ONNX models and PyTorch references.
      - name: Test waypoint-core
        working-directory: waypoint-core
        run: cargo test --release --locked

      - name: Install dependencies
        run: npm ci

      # Every build gets a higher version (major.minor from tauri.conf.json,
      # patch = run number), which is what the in-app updater compares.
      - name: Set version
        id: vars
        shell: bash
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          version="$base.${{ github.run_number }}"
          node -e "
            const fs = require('fs'), f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = '$version';
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + '\n');
          "
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building Waypoint $version"

      # NSIS installer (per-user, no admin) plus its updater signature. The key
      # has no password; the public half is in tauri.conf.json.
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run installer

      - name: Collect build output and write latest.json
        shell: bash
        run: |
          set -e
          version="${{ steps.vars.outputs.version }}"
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          name="Waypoint_${version}_x64-setup.exe"
          mkdir -p dist
          cp "$setup" "dist/$name"
          cp "$setup.sig" "dist/$name.sig"
          # The updater manifest the app reads from releases/latest/download/latest.json.
          node -e "
            const fs = require('fs');
            fs.writeFileSync('dist/latest.json', JSON.stringify({
              version: '$version',
              notes: 'Build ${{ steps.vars.outputs.sha_short }}: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}',
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: fs.readFileSync('dist/$name.sig', 'utf8').trim(),
                  url: '${{ github.server_url }}/${{ github.repository }}/releases/download/v$version/$name',
                },
              },
            }, null, 2));
          "
          ls -la dist
          cat dist/latest.json

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          version="${{ steps.vars.outputs.version }}"
          tag="v$version"
          # A re-run of the same run number would collide on the tag; replace it.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, replacing it"
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" dist/*.exe dist/latest.json \
            --title "Waypoint $version" \
            --notes "Built from ${{ github.sha }}. Run **Waypoint_${version}_x64-setup.exe** to install (per-user, no admin). Installed copies update themselves from here. First launch downloads the inference engine and models (about 3 GB) from https://huggingface.co/killameep/waypoint-models."

      - name: Prune old releases (keep latest 2)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          stale=$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName')
          for t in $stale; do
            echo "Deleting old release $t"
            gh release delete "$t" --yes --cleanup-tag
          done
