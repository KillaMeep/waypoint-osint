[package]
name = "waypoint"
version = "0.2.0"
description = "Free, open-source image geolocation"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "waypoint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
include_dir = "0.7"
base64 = "0.22"
waypoint-core = { path = "../waypoint-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
